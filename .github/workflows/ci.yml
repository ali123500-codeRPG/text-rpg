name: CI
on:
  pull_request:
  push:
    branches: [main]
# WF2 a: a newer push to a PR cancels its older run; every commit on main keeps its own run
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the browser and the font packages it needs, kept between runs: the fonts come from an Ubuntu mirror that
      # sometimes crawls (1 s to 3.7 min for the same 22 MB)
      - id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-debs
          key: playwright-${{ env.ImageOS }}-${{ steps.pw.outputs.v }}
      - run: sudo cp ~/.cache/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p ~/.cache/apt-debs && cp /var/cache/apt/archives/*.deb ~/.cache/apt-debs/ 2>/dev/null || true
      - run: npm run smoke
